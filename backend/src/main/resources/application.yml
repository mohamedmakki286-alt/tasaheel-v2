server:
  port: ${PORT:8080}

spring:
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  datasource:
    url: jdbc:h2:mem:tasaheel;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  sql:
    init:
      mode: always
      continue-on-error: true

application:
  email:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@salabaa.com}
    from-name: ${MAIL_FROM_NAME:تساهيل}
    customer-url: ${CUSTOMER_APP_URL:http://localhost:3201}
    workshop-url: ${WORKSHOP_APP_URL:http://localhost:3102}
    admin-url: ${ADMIN_APP_URL:http://localhost:3103}
  dispatch:
    max-workshops: ${REQUEST_DISPATCH_MAX_WORKSHOPS:10}
    expiry-hours: ${REQUEST_DISPATCH_EXPIRY_HOURS:24}
  payment:
    callback-base-url: ${PAYMENT_CALLBACK_BASE_URL:http://localhost:5175}
  name: Tasaheel
  public-url: ${PUBLIC_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:dGFzYWhlZWwtc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tYW5kLXZhbGlkYXRpb24tZm9yLXRhc2FoZWVsLXBsYXRmb3JtLTIwMjQ=}
    expiration: 604800000
  upload:
    dir: ${user.home}/tasaheel/uploads
  storage:
    provider: ${MEDIA_STORAGE_PROVIDER:local}
    oci:
      region: ${OCI_OBJECT_STORAGE_REGION:me-riyadh-1}
      namespace: ${OCI_OBJECT_STORAGE_NAMESPACE:axwurkwudzgw}
      bucket: ${OCI_OBJECT_STORAGE_BUCKET:tasaheel-media}
  moyasar:
    secret-key: moyasar_secret_key_placeholder
    base-url: https://api.moyasar.com/v1
    webhook-secret: ${MOYASAR_WEBHOOK_SECRET:}
  google:
    maps:
      api-key: AIzaXXXXXXXXXXXXXXXXXXXXXXXXXXX
  firebase:
    config-path: classpath:firebase-service-account.json
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
    credentials-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  ai:
    gemini:
      api-key: ""
      model: gemini-3.6-flash
    provider: gemini

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name:tasaheel-backend}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{X-Request-ID}] - %msg%n"
  level:
    com.tasaheel: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
