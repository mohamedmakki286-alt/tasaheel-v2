server:
  port: 8080

spring:
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  datasource:
    url: jdbc:postgresql://localhost:5432/salaba
    username: salaba
    password: salaba
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: never

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

application:
  email:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@salabaa.com}
    from-name: ${MAIL_FROM_NAME:تساهيل}
    customer-url: ${CUSTOMER_APP_URL:http://localhost:3201}
    workshop-url: ${WORKSHOP_APP_URL:http://localhost:3102}
    admin-url: ${ADMIN_APP_URL:http://localhost:3103}
  name: Tasaheel
  jwt:
    secret: dGFzYWhlZWwtc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tYW5kLXZhbGlkYXRpb24tZm9yLXRhc2FoZWVsLXBsYXRmb3JtLTIwMjQ=
    expiration: 604800000
  upload:
    dir: ${user.home}/tasaheel/uploads
  storage:
    provider: ${MEDIA_STORAGE_PROVIDER:local}
  moyasar:
    secret-key: moyasar_dev_key
    base-url: https://api.moyasar.com/v1
  google:
    maps:
      api-key: local-dev-key
  firebase:
    config-path: classpath:firebase-service-account.json
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
    credentials-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  ai:
    gemini:
      api-key: ""
      model: gemini-1.5-flash
    provider: gemini

logging:
  level:
    com.tasaheel: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
