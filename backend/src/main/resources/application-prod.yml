server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        ssl: true
        sslmode: require
        prepareThreshold: 0
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    defer-datasource-initialization: false

  sql:
    init:
      mode: never

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC

  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 35MB

application:
  email:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:noreply@salabaa.com}
    from-name: ${MAIL_FROM_NAME:تساهيل}
    customer-url: ${CUSTOMER_APP_URL:https://tasaheel-customer.vercel.app}
    workshop-url: ${WORKSHOP_APP_URL:https://tasaheel-workshop.vercel.app}
    admin-url: ${ADMIN_APP_URL:https://tasaheel-admin.vercel.app}
  dispatch:
    max-workshops: ${REQUEST_DISPATCH_MAX_WORKSHOPS:10}
    expiry-hours: ${REQUEST_DISPATCH_EXPIRY_HOURS:24}
  payment:
    callback-base-url: ${PAYMENT_CALLBACK_BASE_URL:https://tasaheel-customer.vercel.app}
  name: Tasaheel
  public-url: ${APPLICATION_PUBLIC_URL:https://api.salabaa.com}
  jwt:
    secret: ${APPLICATION_JWT_SECRET}
    expiration: 604800000
  upload:
    dir: ${APPLICATION_UPLOAD_DIR:/tmp/tasaheel/uploads}
  storage:
    provider: ${MEDIA_STORAGE_PROVIDER:oci}
    migrate-local-on-startup: ${MEDIA_STORAGE_MIGRATE_LOCAL:false}
    oci:
      region: ${OCI_OBJECT_STORAGE_REGION:me-riyadh-1}
      namespace: ${OCI_OBJECT_STORAGE_NAMESPACE:axwurkwudzgw}
      bucket: ${OCI_OBJECT_STORAGE_BUCKET:tasaheel-media}
  moyasar:
    secret-key: ${MOYASAR_SECRET_KEY:}
    base-url: https://api.moyasar.com/v1
  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:}
  firebase:
    config-path: classpath:firebase-service-account.json
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
    credentials-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-1.5-flash
    provider: gemini

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name:tasaheel-backend}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{X-Request-ID}] - %msg%n"
  level:
    com.tasaheel: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
